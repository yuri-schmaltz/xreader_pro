name: CI checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Build with strict warning flags.  Catches the kinds of regressions
  # that the distro-packaged build workflow does not.
  #
  # Run on a matrix of Ubuntu LTS versions to catch the case where
  # a PR compiles cleanly on 24.04 but breaks on 22.04 (e.g. due
  # to a deprecated glib API still present in 22.04's libraries,
  # or a missing -Wno-foo flag in the 24.04 default compiler).
  warnings:
    name: Strict warnings (${{ matrix.distro }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            arch: amd64
            image: ubuntu-22.04
          - distro: ubuntu-24.04
            arch: amd64
            image: ubuntu-24.04
          - distro: ubuntu-24.04
            arch: arm64
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            libxreaderdocument-dev \
            libxreaderview-dev \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (strict warnings)
        run: |
          meson setup build \
            --buildtype=debug \
            --werror \
            --warnlevel=2 \
            -Dc_args="-Wall -Wextra -Wformat=2 -Wformat-security -Wnull-dereference -Wmissing-prototypes -Wmissing-declarations -Wshadow -Wpointer-arith -Wcast-align -Wstrict-prototypes -Wno-unused-parameter"
      - name: Build
        run: ninja -C build
      - name: Test
        run: xvfb-run -a meson test -C build --print-errorlogs

  # Build with AddressSanitizer + UndefinedBehaviorSanitizer.  Catches
  # the kinds of memory safety / UB bugs that the libepub null-pointer
  # fix (commit a79398c) and the sizeof-of-array fix (commit 1cde192)
  # were found by, manually.  This automates the check.
  sanitizers:
    name: ASan + UBSan (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04]
    container:
      image: ubuntu:${{ matrix.distro == 'ubuntu-22.04' && '22.04' || '24.04' }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            libxreaderdocument-dev \
            libxreaderview-dev \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (sanitizers)
        run: |
          CC=clang CXX=clang++ meson setup build-san \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Db_lto=false \
            -Dcpp_args="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -Dc_args="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
      - name: Build
        run: ninja -C build-san
      - name: Test
        run: xvfb-run -a meson test -C build-san --print-errorlogs
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:print_stacktrace=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

  # Run the libFuzzer harness for 60 seconds per CI invocation.
  # Requires PR #13 (feat/fuzz-harness) to be merged first, since
  # the harness lives in fuzz/fuzz-document-load.c.  Once the
  # fuzz harness is on master, this job gives every PR a free
  # quick-fuzz round and catches crashes in the document-parsing
  # path that the unit tests cannot reach.
  fuzz:
    name: 60s libFuzzer smoke
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            libxreaderdocument-dev \
            libxreaderview-dev \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (fuzz)
        run: |
          CC=clang CXX=clang++ meson setup build-fuzz \
            --buildtype=debug \
            -Dfuzz=true \
            -Db_sanitize=address,undefined,fuzzer \
            -Dcpp_args="-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer" \
            -Dc_args="-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer -O1 -g"
      - name: Build
        run: ninja -C build-fuzz fuzz-document-load
      - name: Seed corpus
        run: |
          mkdir -p fuzz-corpus
          # No upstream tests directory; an empty corpus is fine for
          # coverage-driven libFuzzer.  Real corpora (e.g. the
          # xreader-1.0 corpus) can be downloaded as a follow-up
          # and dropped into fuzz-corpus/ to seed the run.
          find test/ -maxdepth 2 -type f \
              \( -name '*.pdf' -o -name '*.djvu' -o -name '*.dvi' -o -name '*.epub' -o -name '*.tiff' -o -name '*.tif' -o -name '*.xps' -o -name '*.oxps' -o -name '*.cbz' -o -name '*.cbr' \) \
              -exec cp {} fuzz-corpus/ \; 2>/dev/null || true
          echo "Corpus size: $(ls -1 fuzz-corpus/ 2>/dev/null | wc -l) file(s)"
      - name: Run fuzzer
        run: |
          cd build-fuzz
          mkdir -p ../fuzz-crashes
          # 60-second time-boxed run.  libFuzzer exits 0 on a clean
          # run, non-zero on the first crash (the offending input
          # is left in ./crash-* in the current dir for upload).
          timeout 60s ./fuzz-document-load ../fuzz-corpus/ \
            -max_len=1048576 \
            -max_total_time=60 \
            -rss_limit_mb=2048 \
            -artifact_prefix=../fuzz-crashes/ \
          || rc=$?
          rc=${rc:-0}
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::fuzz-document-load exited with code $rc"
            echo "Crashing inputs are in fuzz-crashes/ as artifacts"
            exit "$rc"
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
          if-no-files-found: ignore
  # Lint the commit messages of all commits on the PR branch
  # (push events only get the last 10 commits checked, to keep
  # the run time bounded).
  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: lint every commit the PR added on top of master.
            range="origin/master..HEAD"
          else
            # push: lint the last 10 commits (the rest would be
            # covered by their own PRs at the time they landed).
            range="HEAD~10..HEAD"
          fi
          echo "Linting range: $range"
          ./tools/lint-commits.sh "$range"
  # Static analysis with cppcheck.  Catches the kinds of
  # memory-safety, NULL-deref, and uninitialized-variable bugs
  # that the sanitizer job (PR #8) only catches at runtime, and
  # that the warnings job (PR #8) sometimes lets through because
  # -Wall does not flag every CWE.  cppcheck is intentionally
  # run with --enable=warning,style,performance,portability,info
  # (NOT --enable=all, which generates hundreds of false
  # positives in legacy C code).
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cppcheck \
            build-essential \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            intltool \
            pkg-config
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run cppcheck
        run: |
          # The libdocument + shell + libview code is the
          # security-critical attack surface (the document
          # parsers live there), so scan those subdirs first
          # and fail the job on the first error.
          set -e
          cppcheck --quiet --error-exitcode=1 \
            --enable=warning,style,performance,portability,info \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I libdocument -I libview -I shell -I backend -I cut-n-paste -I thumbnailer -I previewer \
            libdocument libview shell backend cut-n-paste thumbnailer previewer
  # Source-style checks: trailing whitespace, CRLF, BOMs, tabs in
  # non-source files, clang-format.  Runs tools/check-source.sh
  # (added in PR #17, made runnable in this PR) on every PR.
  # Catches the 'cosmetic' regressions that the warnings /
  # sanitizers jobs don't (and shouldn't) flag.
  source-style:
    name: Source style (check-source.sh)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-format \
            shellcheck
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run check-source.sh
        run: ./tools/check-source.sh
  # Code coverage with gcov + lcov.  Generates an HTML report
  # of which lines of xreader's C code are exercised by the
  # unit tests, the fuzzer, and the doc-factory tests.  The
  # report is uploaded as a workflow artifact; the CI does
  # not fail on coverage percentage (we don't have a target
  # threshold) but the report is useful for the maintainer
  # to spot under-tested modules.
  coverage:
    name: Code coverage (lcov)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            gettext \
            intltool \
            shared-mime-info \
            lcov \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (coverage)
        run: |
          meson setup build-cov \
            --buildtype=debug \
            -Db_coverage=true \
            --werror
      - name: Build + run unit tests
        run: |
          meson compile -C build-cov
          xvfb-run -a meson test -C build-cov --print-errorlogs
      - name: Capture coverage
        run: |
          lcov --capture --directory build-cov --output-file coverage.info \
            --rc lcov_branch_coverage=1
          lcov --remove coverage.info '/usr/*' '*/cut-n-paste/smclient/*' \
            --output-file coverage.filtered.info
          genhtml coverage.filtered.info --output-directory coverage-html
          echo "Coverage summary:"
          lcov --summary coverage.filtered.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          if-no-files-found: warn
  # Static analysis with clang-tidy.  Catches a different
  # class of issues than cppcheck (PR #41): clang-tidy has
  # checks for performance, modernization, and bugprone
  # patterns that cppcheck does not.  Run on the same scope
  # as the cppcheck job.
  clang-tidy:
    name: clang-tidy static analysis
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang \
            clang-tidy \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            intltool
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: |
          CC=clang CXX=clang++ meson setup build-tidy \
            --buildtype=debug \
            --werror
      - name: Generate compile_commands.json
        run: |
          # clang-tidy needs a compile_commands.json with the
          # exact command lines.  meson generates this in the
          # build directory automatically; symlink it to the
          # project root for clang-tidy's default lookup.
          ln -sf build-tidy/compile_commands.json compile_commands.json
      - name: Run clang-tidy
        run: |
          set -e
          # Run clang-tidy on the same scope as the cppcheck
          # job (libdocument + libview + shell + backend +
          # cut-n-paste + thumbnailer + previewer).  The
          # default checks are: bugprone-, cert-, clang-analyzer-*,
          # performance-, portability-, readability- (the
          # last 3 are too noisy for legacy C, so we use a
          # tighter set).
          clang-tidy --quiet --p=build-tidy \
            -checks="bugprone-*,cert-*,clang-analyzer-*,performance-*" \
            -header-filter=".*\\.h$" \
            $(find libdocument libview shell backend cut-n-paste thumbnailer previewer \
                -name '*.c' -not -path '*/smclient/*' \
                -not -path '*/zoom-control/*') \
            2>&1 | tee clang-tidy.log | head -100
          # If clang-tidy found any issues, the tee output
          # shows the first 100; the full log is in the
          # workflow artifact.
          if grep -qE "warning:|error:" clang-tidy.log; then
            echo "::warning::clang-tidy reported issues (see clang-tidy.log)"
          fi
      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: ignore
  # Include-what-you-use (IWYU) check.  Detects missing or
  # wrong #include directives in the C sources.
  iwyu:
    name: Include-what-you-use
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang \
            iwyu \
            python3 \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            intltool
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: |
          CC=clang CXX=clang++ meson setup build-iwyu \
            --buildtype=debug \
            --werror
      - name: Generate compile_commands.json
        run: ln -sf build-iwyu/compile_commands.json compile_commands.json
      - name: Run iwyu
        run: |
          set +e
          python3 /usr/bin/iwyu_tool.py -p build-iwyu \
            -X ".*cut-n-paste/smclient.*" \
            -X ".*cut-n-paste/zoom-control.*" \
            > iwyu.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::iwyu reported issues (see iwyu.log)"
            head -50 iwyu.log
          fi
      - name: Upload iwyu log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwyu-log
          path: iwyu.log
          if-no-files-found: ignore
  valgrind:
    name: Valgrind memory check
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            gettext \
            intltool \
            shared-mime-info \
            valgrind \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: meson setup build-valgrind --buildtype=debug -Db_sanitize=none --werror
      - name: Build
        run: meson compile -C build-valgrind
      - name: Run unit tests under valgrind
        run: |
          set +e
          cd build-valgrind
          FAILED=0
          for test in test-file-helpers test-mime test-document-factory test-image test-page-render; do
            valgrind --quiet --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite,possible \
              --suppressions=/usr/lib/valgrind/default.supp \
              ./$test > /tmp/$test.log 2>&1 || FAILED=1
          done
          [ $FAILED -eq 0 ]
      - name: Upload valgrind logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: /tmp/test-*.log
          if-no-files-found: ignore
  coverity:
    name: Coverity scan upload
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl
      - name: Download Coverity build tool
        run: |
          if [ -z "$COVERITY_SCAN_TOKEN" ]; then
            echo "COVERITY_SCAN_TOKEN not set, skipping"
            exit 0
          fi
          mkdir -p cov-analysis-linux64
          curl -sSL -o cov.tgz https://scan.coverity.com/download/linux64
          tar xzf cov.tgz -C cov-analysis-linux64 --strip-components=1 || true
      - name: Configure
        run: meson setup build-cov --buildtype=debug --werror
      - name: Build with Coverity
        run: |
          if [ -z "$COVERITY_SCAN_TOKEN" ]; then
            exit 0
          fi
          cov-analysis-linux64/bin/cov-build --dir cov-int meson compile -C build-cov
      - name: Upload
        run: |
          if [ -z "$COVERITY_SCAN_TOKEN" ]; then
            exit 0
          fi
          tar czf cov-int.tgz cov-int
          curl -sSL -F "project=${{ github.repository }}" -F "token=$COVERITY_SCAN_TOKEN" -F "file=@cov-int.tgz" -F "version=${{ github.sha }}" -F "description=CI build" https://scan.coverity.com/builds
  # Build with clang (instead of gcc) on a separate runner.
  # Catches the warnings that gcc does not flag and vice
  # versa.  Not a matrix entry of the warnings job because
  # the install-deps step is different (we need clang
  # instead of gcc).
  clang:
    name: Clang build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang \
            build-essential \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            intltool \
            xvfb
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: |
          CC=clang CXX=clang++ meson setup build-clang \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Dcpp_args="-fno-omit-frame-pointer" \
            -Dc_args="-fno-omit-frame-pointer" \
            --werror
      - name: Build
        run: ninja -C build-clang

  # Run the 9 Python E2E tests under Xvfb.  These tests launch
  # the actual xreader binary and drive it through the GTK menu
  # system via Dogtail (accessibility framework), so they need
  # a real GdkDisplay.  They are skipped on systems without
  # xvfb-run (see test/meson.build).
  #
  # This is the only CI job that exercises the full EvWindow +
  # shell + backends stack, so it is the highest-fidelity
  # integration test we have.  Coverage: 9 cases (file/edit/help/
  # view/zoom/go/bookmarks menus + encrypted file + file reloading
  # + wrong-file-extension).
  e2e-python:
    name: E2E Python tests (xvfb)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            pkg-config \
            python3 \
            python3-dogtail \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: |
          meson setup build-e2e \
            --buildtype=debugoptimized \
            -Ddocs=false \
            -Dhelp_files=false
      - name: Build
        run: ninja -C build-e2e
      - name: Install (to /usr, so that the E2E tests can find the binary)
        run: |
          DESTDIR=/tmp/xreader-install meson install -C build-e2e
          # The Python tests run `xreader` from /usr/bin (workdir).
          # Use a wrapper that points to the staged binary.
          sudo mkdir -p /usr/bin
          sudo cp /tmp/xreader-install/usr/bin/xreader /usr/bin/xreader
          sudo ldconfig
      - name: Run E2E Python tests
        run: xvfb-run -a meson test -C build-e2e --print-errorlogs
